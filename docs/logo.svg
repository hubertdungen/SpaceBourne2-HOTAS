<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#10223f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#1fb6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="0.5" stop-color="#2c4268"/>
      <stop offset="1" stop-color="#16233a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="70" r="1.6" opacity=".8"/><circle cx="210" cy="140" r="1.1" opacity=".6"/>
    <circle cx="330" cy="60" r="1.3" opacity=".7"/><circle cx="520" cy="110" r="1" opacity=".5"/>
    <circle cx="700" cy="50" r="1.5" opacity=".8"/><circle cx="860" cy="120" r="1.1" opacity=".6"/>
    <circle cx="1010" cy="70" r="1.4" opacity=".7"/><circle cx="1180" cy="140" r="1.2" opacity=".6"/>
    <circle cx="1230" cy="520" r="1.4" opacity=".7"/><circle cx="1100" cy="590" r="1" opacity=".5"/>
    <circle cx="760" cy="580" r="1.3" opacity=".6"/><circle cx="560" cy="600" r="1.1" opacity=".5"/>
    <circle cx="140" cy="560" r="1.5" opacity=".7"/><circle cx="60" cy="380" r="1" opacity=".5"/>
    <circle cx="1240" cy="330" r="1.2" opacity=".6"/><circle cx="640" cy="20" r="1" opacity=".5"/>
  </g>
  <!-- orbit ring -->
  <ellipse cx="370" cy="350" rx="250" ry="92" fill="none" stroke="#1fb6ff" stroke-width="4" opacity=".55" transform="rotate(-18 370 350)"/>
  <ellipse cx="370" cy="350" rx="250" ry="92" fill="none" stroke="#ff7a1a" stroke-width="4" stroke-dasharray="120 900" stroke-linecap="round" transform="rotate(-18 370 350)"/>
  <!-- joystick -->
  <g transform="translate(370 330)">
    <ellipse cx="0" cy="190" rx="150" ry="34" fill="#0d1628" stroke="#1fb6ff" stroke-width="3"/>
    <!-- boot, then stick tilted forward-right like it's being flown -->
    <path d="M-40,190 C-40,160 40,160 40,190 Z" fill="#22324f" stroke="#1fb6ff" stroke-width="3"/>
    <g transform="rotate(12 0 185)">
      <rect x="-15" y="30" width="30" height="160" rx="8" fill="#22324f" stroke="#1fb6ff" stroke-width="3"/>
      <!-- ergonomic grip: wide head, finger bumps on the front, palm rest at the back -->
      <path d="M-58,-150 C-90,-205 70,-230 88,-160 C96,-128 80,-110 72,-90 C66,-74 74,-60 66,-44 C60,-30 66,-16 58,0
               C54,24 50,42 30,52 L-28,52 C-60,40 -78,10 -74,-30 C-70,-70 -40,-100 -58,-150 Z"
            fill="url(#grip)" stroke="#1fb6ff" stroke-width="4" stroke-linejoin="round"/>
      <!-- trigger -->
      <path d="M70,-96 C104,-92 108,-58 76,-50" fill="none" stroke="#ff7a1a" stroke-width="8" stroke-linecap="round"/>
      <!-- hat switch on top -->
      <circle cx="10" cy="-172" r="20" fill="#0d1628" stroke="#ff7a1a" stroke-width="4"/>
      <path d="M10,-186 L10,-158 M-4,-172 L24,-172" stroke="#ff7a1a" stroke-width="4" stroke-linecap="round"/>
      <!-- thumb button -->
      <circle cx="-38" cy="-150" r="10" fill="#ff7a1a"/>
      <!-- grip texture -->
      <path d="M-50,-40 L40,-40 M-52,-14 L44,-14 M-46,12 L42,12" stroke="#1fb6ff" stroke-width="2" opacity=".45"/>
    </g>
  </g>
  <!-- title -->
  <text x="690" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="132" font-weight="800" fill="#ffffff" letter-spacing="4">SB2</text>
  <text x="690" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="132" font-weight="800" fill="#1fb6ff" letter-spacing="6">HOTAS</text>
  <rect x="694" y="446" width="470" height="5" rx="2.5" fill="#ff7a1a"/>
  <text x="694" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#c9d6ea" letter-spacing="1">for SpaceBourne 2</text>
  <text x="694" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#8ea4c4" letter-spacing="1">joystick · throttle · pedals · head tracking</text>
</svg>
